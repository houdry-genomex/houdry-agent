# First-run Desktop seed for Houdry Agent (MRPL).
# Copied into $HERMES_HOME/config.yaml only when that file is missing.
# Windows default home: %LOCALAPPDATA%\houdry-agent
#
# Houdry fabric = default inference: fully on-premise, GPU-local, no data
# leaves the machine. Azure GPT-5.6 Luna stays available as the alternate
# provider for cloud-backed work (see config/azure-openai.defaults.yaml).
# Secrets stay in $HERMES_HOME/.env — never in this file.

model:
  # Alias of `custom`. With no base_url, this resolves to $HOUDRY_BASE_URL or
  # http://127.0.0.1:18080/v1 — the fabric's OpenAI-compatible surface.
  provider: houdry
  # "auto" hands model choice to the fabric's router, which sizes the model to
  # the request. Pinning a specific model here would bypass that.
  default: "auto"
  api_mode: chat_completions

approvals:
  mode: smart # or manual for stricter human-in-the-loop

memory:
  memory_enabled: true
  write_approval: true

skills:
  write_approval: true

security:
  redact_secrets: true

# Prefer `hermes tools` to disable unrelated toolsets (image_gen, spotify,
# homeassistant, discord_admin) rather than deleting upstream code.
