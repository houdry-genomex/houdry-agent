# Default model config for Azure OpenAI (GPT-5.6 Luna etc.)
#
# Copy into $HERMES_HOME/config.yaml or merge the `model:` block.
# Secrets stay in $HERMES_HOME/.env — never commit real keys.
#
# .env:
#   AZURE_OPENAI_API_KEY=...
#   AZURE_OPENAI_ENDPOINT=https://YOUR_RESOURCE.openai.azure.com
#   AZURE_OPENAI_DEPLOYMENT=gpt-5.6-luna
#
# Or Foundry names (also accepted):
#   AZURE_FOUNDRY_API_KEY=...
#   AZURE_FOUNDRY_BASE_URL=https://YOUR_RESOURCE.openai.azure.com/openai/v1
#
# Switch back to Houdry fabric: see config/houdry-fabric.defaults.yaml
# and docs/AZURE_OPENAI.md

model:
  provider: azure  # alias of azure-foundry
  # Deployment name is the model id Azure expects:
  default: "gpt-5.6-luna"
  api_mode: chat_completions
  # Optional if AZURE_OPENAI_ENDPOINT is set in .env:
  # base_url: "https://YOUR_RESOURCE.openai.azure.com/openai/v1"
