name: Desktop Windows release

# Builds the NSIS installer and attaches it to the GitHub Release for the tag.
# Direct download:
#   https://github.com/houdry-genomex/houdry-agent/releases/latest/download/Houdry-Agent-<version>-win-x64.exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nsis:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:nsis -- --publish never

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem -Path apps/desktop/release -Filter "Houdry-Agent-*-win-*.exe")
          if ($files.Count -eq 0) { throw "No NSIS installer found under apps/desktop/release" }
          gh release create $env:GITHUB_REF_NAME $files.FullName --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
